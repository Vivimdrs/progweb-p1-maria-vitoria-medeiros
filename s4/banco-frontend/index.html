<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banco Digital — Painel de Clientes</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="bg-light">
  <header class="bg-primary text-white py-3 mb-4 shadow-sm">
    <div class="container">
      <h1 class="h4 mb-0">Banco Digital — Gestão de Clientes</h1>
    </div>
  </header>

  <main class="container pb-5">
    <div id="area-aviso" class="mb-3"></div>

    <div class="row g-4">
      <section class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 id="titulo-form" class="h5 card-title mb-3">Novo Cliente</h2>
            <form id="form-cliente" novalidate>
              <input type="hidden" id="cliente-id" name="id" />

              <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" id="nome" name="nome" class="form-control" required />
              </div>

              <div class="mb-3">
                <label for="cpf" class="form-label">CPF (11 dígitos)</label>
                <input type="text" id="cpf" name="cpf" maxlength="11" class="form-control" required />
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" id="email" name="email" class="form-control" required />
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Salvar</button>
                <button type="button" id="btn-cancelar" class="btn btn-outline-secondary d-none">
                  Cancelar
                </button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <section class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h5 card-title mb-0">Clientes Cadastrados</h2>
              <button type="button" id="btn-recarregar" class="btn btn-sm btn-outline-primary">
                Recarregar
              </button>
            </div>

            <div id="estado-carregando" class="text-center py-4 d-none">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Carregando...</span>
              </div>
              <p class="text-muted mt-2 mb-0">Carregando clientes...</p>
            </div>

            <div id="estado-erro" class="alert alert-danger d-none" role="alert"></div>

            <!-- Estado 3: Vazio -->
            <div id="estado-vazio" class="alert alert-secondary text-center d-none">
              Nenhum cliente cadastrado até o momento.
            </div>

            <div id="estado-sucesso" class="table-responsive d-none">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>E-mail</th>
                    <th class="text-end">Ações</th>
                  </tr>
                </thead>
                <tbody id="tabela-clientes"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
